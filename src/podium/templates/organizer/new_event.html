{% extends "layouts/public.html" %}
{% from "macros/ui.html" import field %}
{% block content %}
<div class="page-header"><div><p class="page-header__eyebrow">Organizer</p><h1>Create an event</h1><p class="ink-2 mt-2">You'll be its organizer. Everything here can be changed later in Settings.</p></div></div>
<form class="stack form-narrow" method="post" action="/events/new" hx-boost="false" data-guard>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  {% include "organizer/_event_fields.html" %}
  <div class="cluster form-actions"><button class="btn btn--primary" type="submit">Create event</button><a class="btn btn--ghost" href="/">Cancel</a></div>
</form>
{% endblock %}
