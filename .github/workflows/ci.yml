name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel a run on main

defaults:
  run:
    shell: bash  # explicit bash runs with -eo pipefail

jobs:
  checks:
    name: Lint, migrations and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.12.1
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked dependencies
        run: uv sync --frozen

      - name: Lockfile matches pyproject.toml
        run: uv lock --check

      - name: Organizer checker and fixtures are byte-identical to the originals
        run: |
          sha256sum --check <<'EOF'
          aa98963841bc8e18e8e5d76f0499697c093dd3c0055f9d73a459f592f4dcf09d  tools/run.py
          252896bc45d49fca69ad413be40c6bfde9d9b9f9dd8db702b3ff74eaaa181121  tools/fixtures.json
          252896bc45d49fca69ad413be40c6bfde9d9b9f9dd8db702b3ff74eaaa181121  fixtures/fixtures.json
          EOF

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Migrations upgrade, downgrade and match the models
        env:
          PODIUM_DATA_DIR: ${{ runner.temp }}/migrations
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests - T1/T2 checker requests and the authorization matrix
        run: uv run pytest -q tests/test_acceptance.py tests/test_authz_matrix.py

      - name: Tests - T3 voting, ballots and comments
        run: uv run pytest -q tests/test_voting.py

      - name: Tests - T4 tokens, webhooks, certificates, embed, import and export
        run: uv run pytest -q tests/test_t4.py

      - name: Tests - normalization and Bradley-Terry
        run: uv run pytest -q tests/test_normalization.py tests/test_pairwise.py

      - name: Tests - pages, forms, lifecycle and regressions
        run: >-
          uv run pytest -q
          --ignore=tests/test_acceptance.py --ignore=tests/test_authz_matrix.py
          --ignore=tests/test_voting.py --ignore=tests/test_t4.py
          --ignore=tests/test_normalization.py --ignore=tests/test_pairwise.py

      - name: The README's non-Docker path reproduces the committed report
        env:
          PODIUM_DATA_DIR: ${{ runner.temp }}/local
        run: |
          make migrate
          make seed
          PODIUM_DEMO_ACCOUNTS=true uv run uvicorn podium.main:app --host 127.0.0.1 --port 8080 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1 && break; sleep 1; done
          python3 tools/run.py .dogfood.toml --fixtures fixtures/fixtures.json > "$RUNNER_TEMP/local-report.txt"
          diff -u acceptance-report.txt "$RUNNER_TEMP/local-report.txt"

  acceptance:
    name: Acceptance checker against docker compose up
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build from the clean clone, as a judge would
        run: docker compose build

      - name: docker compose up
        run: docker compose up -d

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "healthy after about ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::no answer on /healthz after 90 seconds"
          exit 1

      - name: Boot log prints the demo logins
        run: |
          docker compose logs --no-color web > "$RUNNER_TEMP/boot.log"
          grep -q 'seeded. test logins:' "$RUNNER_TEMP/boot.log"

      - name: Organizer's checker, unmodified (writes a temp file, never the repo)
        run: |
          report="$RUNNER_TEMP/acceptance-report.txt"
          python3 tools/run.py .dogfood.toml --fixtures fixtures/fixtures.json | tee "$report"
          { echo '### tools/run.py against a fresh docker compose up'; echo '```'; cat "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE ' FAIL$' "$report"; then
            echo "::error::the checker printed a FAIL line"
            exit 1
          fi
          passed=$(grep -cE '^T[12]  .* PASS$' "$report")
          if [ "$passed" -ne 7 ]; then
            echo "::error::expected 7 PASS lines, got $passed"
            exit 1
          fi
          if ! grep -qx 'claimed T1 T2 T3 T4, verified T1 T2' "$report"; then
            echo "::error::summary is not 'claimed T1 T2 T3 T4, verified T1 T2'"
            exit 1
          fi

      - name: Committed acceptance-report.txt is exactly what the checker printed
        run: diff -u acceptance-report.txt "$RUNNER_TEMP/acceptance-report.txt"

      - name: The checker also finds fixtures.json beside run.py, as the spec describes
        run: |
          report="$RUNNER_TEMP/default-report.txt"
          python3 tools/run.py .dogfood.toml | tee "$report"
          if grep -qE ' FAIL$' "$report"; then
            echo "::error::the checker printed a FAIL line"
            exit 1
          fi
          [ "$(grep -cE '^T[12]  .* PASS$' "$report")" -eq 7 ]

      - name: Keep the fresh report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: acceptance-report
          path: ${{ runner.temp }}/acceptance-report.txt
          if-no-files-found: ignore

      - name: Portal log
        if: failure()
        run: docker compose logs --no-color web

      - name: Tear down
        if: always()
        run: docker compose down -v

  offline:
    name: Network-off boot (docker run --network none)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the image (the only step that uses the network)
        run: docker build -t podium:ci .

      - name: Start it with no network interface at all
        run: docker run -d --name podium-offline --network none -e PODIUM_DEMO_ACCOUNTS=true podium:ci

      - name: Wait for the image's own healthcheck
        run: |
          state=starting
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}}/{{.State.Health.Status}}' podium-offline)
            if [ "$state" = running/healthy ]; then echo "healthy after about $((i * 2))s"; exit 0; fi
            [ "${state%%/*}" = running ] || break
            sleep 2
          done
          echo "::error::container state is $state"
          exit 1

      - name: The container has no route out
        run: |
          if docker exec podium-offline python -c "import socket; socket.create_connection(('1.1.1.1', 443), timeout=3)" 2> /dev/null; then
            echo "::error::the container reached the internet"
            exit 1
          fi

      - name: Organizer's checker, run inside the air-gapped container
        run: |
          docker cp tools/run.py podium-offline:/tmp/run.py
          docker cp .dogfood.toml podium-offline:/tmp/dogfood.toml
          report="$RUNNER_TEMP/offline-report.txt"
          docker exec podium-offline python /tmp/run.py /tmp/dogfood.toml --fixtures /app/fixtures/fixtures.json | tee "$report"
          if grep -qE ' FAIL$' "$report"; then
            echo "::error::FAIL with the network off"
            exit 1
          fi
          [ "$(grep -cE '^T[12]  .* PASS$' "$report")" -eq 7 ]
          grep -q ', verified T1 T2$' "$report"

      - name: Hard rules probed from inside the container
        run: |
          docker exec -i podium-offline python - <<'PY'
          import json, re, urllib.error, urllib.request
          BASE = 'http://127.0.0.1:8080'
          ORGANIZER = 'session=org_4be7f712dd292c7905b0'
          JUDGE_B = 'session=jdg_b_afebfc3dbf25925af382'

          def get(path, cookie=None):
              req = urllib.request.Request(BASE + path, headers={'Cookie': cookie} if cookie else {})
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      return resp.status, resp.headers, resp.read().decode()
              except urllib.error.HTTPError as err:
                  return err.code, err.headers, err.read().decode()

          status, _, body = get('/healthz')
          assert status == 200 and json.loads(body)['status'] == 'ok', (status, body)
          status, headers, gallery = get('/e/sample-hack-2026/projects')
          fixture = json.load(open('/app/fixtures/fixtures.json'))
          assert status == 200 and any(p['title'] in gallery for p in fixture['projects'][:3]), status
          assert "default-src 'self'" in headers.get('content-security-policy', ''), 'no CSP'
          status, _, _ = get('/api/v1/events/sample-hack-2026/judges/jdg_24/reviews', JUDGE_B)
          assert status == 403, f'judge_b read judge_a reviews: {status}'
          status, _, csv = get('/api/v1/events/sample-hack-2026/exports/scores.csv', ORGANIZER)
          assert status == 200 and ',' in csv.splitlines()[0], status
          asset = re.compile(r'<(?:script|link|img|source|iframe)\b[^>]*?\s(?:src|href)="([^"]*)"', re.I)
          for path in ['/', '/login', '/e/sample-hack-2026/projects', '/api/docs', '/api/docs/console']:
              status, _, page = get(path)
              external = [u for u in asset.findall(page) if u.startswith('//') or not u.startswith(('/', 'data:'))]
              assert status == 200 and not external, (path, status, external)
          print('offline: healthz, gallery, isolation, CSV, CSP and same-origin assets pass')
          PY

      - name: Container log
        if: failure()
        run: docker logs podium-offline

      - name: Tear down
        if: always()
        run: docker rm -fv podium-offline
